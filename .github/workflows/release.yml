name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DIST_DIR: dist

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instaladores
        run: bash scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Sumas de verificación
        run: (cd "${DIST_DIR}" && sha256sum gastronova-impresion.* >SHA256SUMS)
      - name: Release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${DIST_DIR}"/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${DIST_DIR}"/* --verify-tag \
              --title "Gastronova Impresión ${GITHUB_REF_NAME#v}" \
              --notes "En Windows se instala con una línea: \`irm https://gastronova.com.ar/impresion | iex\` en PowerShell, o \`winget install Gastronova.Impresion\`."
          fi
