name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DIST_DIR: dist
  WINDOWS_INSTALLER: gastronova-impresion.exe

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      windows-artifact-id: ${{ steps.windows.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instaladores
        run: bash scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Instalador de Windows sin firmar
        id: windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: ${{ env.DIST_DIR }}/${{ env.WINDOWS_INSTALLER }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: other-packages
          path: |
            ${{ env.DIST_DIR }}/*.deb
            ${{ env.DIST_DIR }}/*.rpm
            ${{ env.DIST_DIR }}/*.zip
          if-no-files-found: error

  sign:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Firma con SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.windows-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signed
          path: signed/${{ env.WINDOWS_INSTALLER }}
          if-no-files-found: error

  publish:
    needs: [build, sign]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sign.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_ARTIFACT: ${{ needs.sign.result == 'success' && 'windows-signed' || 'windows-unsigned' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: other-packages
          path: ${{ env.DIST_DIR }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.WINDOWS_ARTIFACT }}
          path: ${{ env.DIST_DIR }}
      - name: Sumas de verificación
        run: (cd "${DIST_DIR}" && sha256sum gastronova-impresion.* >SHA256SUMS)
      - name: Release
        run: |
          notes="Instalador de Windows sin firmar."
          if [[ "${WINDOWS_ARTIFACT}" == "windows-signed" ]]; then
            notes="Instalador de Windows firmado por SignPath Foundation."
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${DIST_DIR}"/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${DIST_DIR}"/* --verify-tag \
              --title "Gastronova Impresión ${GITHUB_REF_NAME#v}" --notes "${notes}"
          fi
